name: Release

# v* tag'i push edildiginde (orn. v0.9.14) hem macOS hem Windows build'ini alir.
#   git tag v0.9.14 && git push origin v0.9.14
#
# AKIS: release once TASLAK (draft) olarak olusturulur -> iki platform da taslaga
# yuklenir -> en sonda yayinlanir. electron-updater taslagi GORMEZ, yani build
# suresince kullanicinin uygulamasi eski yayinda kalir; "latest-mac.yml 404"
# yaris hatasi olusmaz. Tum artifact'lar hazir olunca tek seferde yayinlanir.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # prisma generate + next build icin gerekli (repodaki dev.db yeterli)
  DATABASE_URL: "file:./prisma/dev.db"

jobs:
  # Iki build paralel ayni release'e yazdigi icin, race/duplike olmamasi adina
  # TASLAK release'i once burada bir kez olusturuyoruz.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" \
              --notes "Magicland 3D Hub $TAG"
          fi

  build-mac:
    needs: create-release
    runs-on: macos-latest # arm64 runner — package.json mac target'i da arm64
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # electron-builder, self-signed sertifikayi "trusted degil" diye reddedip ad-hoc'a
      # dusuyordu. Burada ozel bir keychain'e import edip kod imzalama icin TRUSTED
      # yapiyoruz; boylece `security find-identity -v -p codesigning` gecerli sayiyor.
      - name: Set up self-signed signing keychain
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KPASS="ci-temp-$RANDOM"
          P12="$RUNNER_TEMP/cert.p12"
          CER="$RUNNER_TEMP/cert.pem"

          echo "$MAC_CSC_LINK" | base64 --decode > "$P12"
          security create-keychain -p "$KPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPASS" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$MAC_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          # Self-signed sertifikayi kod imzalama icin guvenilir kok yap
          security find-certificate -c "Magicland 3D Hub" -p "$KEYCHAIN" > "$CER"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$CER"

          rm -f "$P12" "$CER"
          echo "Gecerli imza kimlikleri:"
          security find-identity -v -p codesigning "$KEYCHAIN"
      # Windows tarafiyla ayni gerekce: electron-builder ikilileri kesintili bir adresten
      # iniyor. macOS bugun sansliydi ama ayni riski tasiyor.
      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron-builder
          key: eb-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            eb-cache-${{ runner.os }}-
      - name: Build app
        run: |
          for i in 1 2 3; do
            npx electron-builder --mac --publish always && exit 0
            echo "electron-builder denemesi $i/3 basarisiz"
            [ "$i" -lt 3 ] && sleep $((20 * i))
          done
          exit 1
      # Guvence: electron-builder bazen latest-mac.yml'i atliyor. Taslaga gh ile
      # garanti yukle (--clobber: varsa uzerine yaz). gh draft'i tag ile bulur.
      # continue-on-error: gh yukleyemezse build'i bozma — electron-builder'inki kalir.
      - name: Ensure latest-mac.yml uploaded
        continue-on-error: true
        run: gh release upload "${GITHUB_REF_NAME}" dist/latest-mac.yml --clobber

  build-windows:
    needs: create-release
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # electron-builder her calismada kendi ikililerini (winCodeSign, nsis, nsis-resources)
      # github.com/.../releases/download adresinden cekiyor ve bu adres kesintili: 12 Agu 2026'da
      # UC AYRI derleme "EOF" ile dustu. Onbellek dolduktan sonra indirme hic yapilmaz.
      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: eb-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            eb-cache-${{ runner.os }}-
      # Soguk onbellekte indirme yine gerekiyor. electron-builder'in kendi yeniden denemesi
      # dort kez 1 SANIYE arayla oldugu icin dalgalanmayi asamiyor; disaridan sabirli sar.
      # Indirme asamasinda dusen calisma hicbir sey yayinlamamis olur, tekrar guvenli.
      - name: Build installer
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            npx electron-builder --win --publish always
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "electron-builder denemesi $i/3 basarisiz (cikis kodu $LASTEXITCODE)"
            if ($i -lt 3) { Start-Sleep -Seconds (20 * $i) }
          }
          exit 1
      - name: Ensure latest.yml uploaded
        continue-on-error: true
        run: gh release upload "${env:GITHUB_REF_NAME}" dist/latest.yml --clobber

  # Her iki build de bitince taslagi YAYINLA — tek seferde, tum artifact'lar hazirken.
  # Boylece electron-updater yeni surumu ancak tam haliyle gorur (404 yaris yok).
  publish:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      # Bu job'da checkout yok; gh repo'yu git'ten anlamaya calisip "not a git
      # repository" hatasi veriyordu. --repo ile repoyu acikca veriyoruz.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
